# 自托管部署用。地理位置数据库缺失时构建过程会自动从 Release geo-data 下载；
# 想用源头最新版可先运行 ./scripts/fetch-geo-data.sh。
# 可选配置（ADMIN_TOKEN、PARSE_VV_SECRET、OPENTELEMETRY 等，见 README）：
#   - 本地 / 手动部署：写入同目录 .env 文件
#   - Portainer 从 Git 部署：在 stack 页面的 Environment variables 中填写，
#     Portainer 会写入 stack.env；页面上的变量只替换本文件里的 ${VAR}，不会自动传给容器，
#     必须通过下面的 env_file 加载
services:
  server:
    build:
      context: .
      target: final
    image: riskapi:latest
    restart: unless-stopped
    # 只监听本机，由宿主机上的反向代理对外提供服务
    ports:
      - "127.0.0.1:10100:8080"
    env_file:
      - path: .env
        required: false
      # 放在 .env 之后：同名变量以 Portainer 页面上的值为准
      - path: stack.env
        required: false
    environment:
      LOG_FORMAT: json
    # 运行期不写文件系统，风险 IP 列表与缓存都在内存中
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # 需大于程序内 15s 的优雅停机超时
    stop_grace_period: 20s
    # 风险 IP 列表加载完成前 /api/ready 返回 503
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
