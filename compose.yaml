# 自托管部署用。地理位置数据库缺失时构建过程会自动从 Release geo-data 下载；
# 想用源头最新版可先运行 ./scripts/fetch-geo-data.sh。
# 可选配置（ADMIN_TOKEN、PARSE_VV_SECRET 等，见 README）写入同目录 .env 文件。
services:
  server:
    build:
      context: .
      target: final
    image: riskapi:latest
    restart: unless-stopped
    # 只监听本机，由宿主机上的反向代理对外提供服务
    ports:
      - "127.0.0.1:10100:8080"
    env_file:
      - path: .env
        required: false
    environment:
      LOG_FORMAT: json
      # 被蜜罐标记的来源保存在卷里，重启后保留；需要同时在 .env 中设置 HONEYTRAP_SECRET 才会生效
      HONEYTRAP_FLAG_FILE: /var/lib/riskapi/honeytrap-flagged.jsonl
    # 根文件系统只读；唯一可写的是下面的卷，用于保存蜜罐标记
    read_only: true
    volumes:
      - riskapi-state:/var/lib/riskapi
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # 需大于程序内 15s 的优雅停机超时
    stop_grace_period: 20s
    # 风险 IP 列表加载完成前 /api/ready 返回 503
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  riskapi-state:
