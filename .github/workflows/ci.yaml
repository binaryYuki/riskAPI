      #       -H "Content-Type: application/json" \
      #       -d '{}' \
      #       -o /tmp/koyeb_resp.json \
      #       -w "%{http_code}" \
      #       "https://app.koyeb.com/v1/services/${KOYEB_SERVICE_ID}/redeploy")
