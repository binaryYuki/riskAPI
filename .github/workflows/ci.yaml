name: docker release

on:
  push:
    branches:
      - master
    paths:
      - '**'
      - '!README.md'
      - '!README_cn.md'
      - '!docs/**'
      - '!.github/**'
  # PR 上只做构建与检查（测试、govulncheck、镜像构建），不推送镜像、不部署、不更新 Release；
  # 不排除 .github/**，修改 workflow 的 PR 同样需要验证
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'README_cn.md'
      - 'docs/**'
  # 每日下载最新地理位置数据库、构建镜像并重新部署（取代原 auto-update 提交 mmdb 的流程）。
  # 避开整点：GitHub 在整点负载最高，定时任务常被延迟数小时甚至丢弃（原 03:00 实际 08:18~09:46 才执行）
  schedule:
    - cron: "37 2 * * *"
  # 在非 master 分支手动运行时只构建验证，不推送镜像、不部署、不更新 Release
  workflow_dispatch:

permissions:
  contents: write # 更新 geo-data Release

concurrency:
  group: docker-release-${{ github.ref }}
  # PR 有新提交时取消旧的检查；master 上的部署不中断
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # PR 与非 master 分支只构建验证；master 上额外推送镜像、更新 Release 并部署
    name: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/master') && 'build & deploy' || 'build (no push)' }}
    runs-on: ubuntu-latest
    env:
      # 仅 master 上的 push / schedule / 手动运行才推送镜像、更新 Release、部署
      DEPLOY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
      # 来自 fork 的 PR 拿不到 secrets，用占位命名空间保证镜像 tag 合法（此时只构建、不推送）
      IMAGE: ${{ secrets.DOCKER_USERNAME || 'local' }}/risk-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # 版本以 go.mod 的 go 指令为准（需与 Dockerfile GO_VERSION 一致）

      # 地理位置数据库不入 git：先取 geo-data Release 的最近成功版本兜底，再从源头更新
      - name: Fetch geo databases
        env:
          GH_TOKEN: ${{ github.token }}
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: ./scripts/fetch-geo-data.sh

      - name: Download Go modules
        run: go mod download

      - name: Build Go project
        run: go build -v ./...

      - name: Run Go tests
        run: go test -race -v ./...

      # 漏洞扫描：代码实际调用到已知漏洞时失败，阻止带漏洞的镜像发布
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.DEPLOY == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 构建多架构镜像；仅 master 推送
      - name: Build multi-arch Docker image (push on master only)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.DEPLOY == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ github.run_id }}
            ${{ env.IMAGE }}:latest

      # 镜像推送成功后，把本次使用的数据库保存为新的“最近成功版本”
      - name: Update geo-data release
        if: env.DEPLOY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          find providers -type f \( -name '*.mmdb' -o -name 'qqwry.dat' \) -exec cp {} "$stage/" \;
          cd "$stage"
          sha256sum ./*.mmdb qqwry.dat > SHA256SUMS
          # 数据未变化时不上传：--clobber 是逐个先删后传，覆盖期间正在构建的
          # Portainer（Dockerfile 从此 Release 下载）会遇到 404 或校验不一致
          prev="$(mktemp -d)"
          if gh release download geo-data --pattern SHA256SUMS --dir "$prev" --repo "$GITHUB_REPOSITORY" \
            && cmp -s SHA256SUMS "$prev/SHA256SUMS"; then
            echo "geo data unchanged, skipping release upload"
            exit 0
          fi
          # 数据文件先传、SHA256SUMS 最后传，缩短新旧不一致的窗口（Dockerfile 会重试）
          gh release upload geo-data ./*.mmdb qqwry.dat --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload geo-data SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

      # 触发 Portainer stack webhook：Portainer 从 Git 拉取并重新构建部署
      - name: Redeploy via Portainer webhook
        if: env.DEPLOY == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -X POST -o /tmp/webhook_resp.txt -w "%{http_code}" "${WEBHOOK_URL}")
          echo "Portainer webhook HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "Redeploy failed. Response body:"
            cat /tmp/webhook_resp.txt
            exit 1
          fi
          echo "Redeploy triggered successfully."

      # 已迁移到 Portainer，Koyeb 部署暂时停用
