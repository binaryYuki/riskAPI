name: docker release

on:
  push:
    branches:
      - master
    paths:
      - '**'
      - '!README.md'
      - '!README_cn.md'
      - '!docs/**'
      - '!.github/**'
  # 每日下载最新地理位置数据库、构建镜像并重新部署（取代原 auto-update 提交 mmdb 的流程）
  schedule:
    - cron: "0 3 * * *"
  # 在非 master 分支手动运行时只构建验证，不推送镜像、不部署、不更新 Release
  workflow_dispatch:

permissions:
  contents: write # 更新 geo-data Release

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DEPLOY: ${{ github.ref == 'refs/heads/master' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # 版本以 go.mod 的 go 指令为准（需与 Dockerfile GO_VERSION 一致）

      # 地理位置数据库不入 git：先取 geo-data Release 的最近成功版本兜底，再从源头更新
      - name: Fetch geo databases
        env:
          GH_TOKEN: ${{ github.token }}
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: ./scripts/fetch-geo-data.sh

      - name: Download Go modules
        run: go mod download

      - name: Build Go project
        run: go build -v ./...

      - name: Run Go tests
        run: go test -race -v ./...

      # 漏洞扫描：代码实际调用到已知漏洞时失败，阻止带漏洞的镜像发布
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.DEPLOY == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 构建多架构镜像；仅 master 推送
      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.DEPLOY == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/risk-api:${{ github.run_id }}
            ${{ secrets.DOCKER_USERNAME }}/risk-api:latest

      # 镜像推送成功后，把本次使用的数据库保存为新的“最近成功版本”
      - name: Update geo-data release
        if: env.DEPLOY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          find providers -type f \( -name '*.mmdb' -o -name 'qqwry.dat' \) -exec cp {} "$stage/" \;
          cd "$stage"
          sha256sum ./*.mmdb qqwry.dat > SHA256SUMS
          gh release upload geo-data ./* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Redeploy Koyeb service
        if: env.DEPLOY == 'true'
        env:
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
          KOYEB_SERVICE_ID: ${{ secrets.KOYEB_SERVICE_ID }}
        run: |
          set -euo pipefail
          sleep 3 # 等待镜像仓库同步
          echo "Triggering redeploy for service ${KOYEB_SERVICE_ID: -4}..."
          HTTP_CODE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${KOYEB_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -o /tmp/koyeb_resp.json \
            -w "%{http_code}" \
            "https://app.koyeb.com/v1/services/${KOYEB_SERVICE_ID}/redeploy")
          echo "Koyeb API HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "Redeploy failed. Response body:"
            cat /tmp/koyeb_resp.json
            exit 1
          fi
          echo "Redeploy triggered successfully."
